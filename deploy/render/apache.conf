<VirtualHost *:8080>
    DocumentRoot /var/www/saldo/public

    <Directory /var/www/saldo/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        CGIPassAuth On
        DirectoryIndex disabled
        DirectoryIndex index.html

        RewriteEngine On
        RewriteRule ^(?:api(?:/|$)|up/?$) index.php [END]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [END]
    </Directory>
</VirtualHost>
